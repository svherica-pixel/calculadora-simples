<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora</title>
  <link rel="stylesheet" href="style.css">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1c1c1c">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>

    <div class="calculadora">
        <div class="visor" id="visor">0</div>
        <div class="teclado">
            <button class="tecla limpar dupla" id="btn-limpar">AC</button>
            <button class="tecla funcao" data-valor="%">%</button>
            <button class="tecla funcao" data-valor="^">xʸ</button>

            <button class="tecla funcao dupla" data-valor="√">√</button>
            <button class="tecla funcao dupla" data-valor="ⁿ√">ⁿ√</button>

            <button class="tecla op" data-valor="+">+</button>
            <button class="tecla op" data-valor="-">-</button>
            <button class="tecla op" data-valor="*">×</button>
            <button class="tecla op divisao" data-valor="/">÷</button>

            <button class="tecla numero" data-valor="7">7</button>
            <button class="tecla numero" data-valor="8">8</button>
            <button class="tecla numero" data-valor="9">9</button>

            <button class="tecla igual" id="btn-igual">=</button>

            <button class="tecla numero" data-valor="4">4</button>
            <button class="tecla numero" data-valor="5">5</button>
            <button class="tecla numero" data-valor="6">6</button>
            <button class="tecla numero" data-valor="1">1</button>
            <button class="tecla numero" data-valor="2">2</button>
            <button class="tecla numero" data-valor="3">3</button>

            <button class="tecla numero dupla" data-valor="0">0</button>
            <button class="tecla numero" data-valor=".">.</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
